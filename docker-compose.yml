version: '3.8'

services:
  # 1. Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: book_carousel_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: book_carousel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  # 2. Orquestador n8n
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: book_carousel_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=book_carousel
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgrespassword
      - RENDERER_URL=http://renderer:3001
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      - postgres
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  # 3. Microservicio Renderizador de Plantillas de Carruseles
  renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    container_name: book_carousel_renderer
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-book-carousels}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-book-carousels}
    restart: unless-stopped

  # 4. Frontend Web para Librerías
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: book_carousel_frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - renderer
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
